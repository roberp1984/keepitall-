name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Refresh package lists first: stale lists make apt-get fail with exit code 100.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm test
      - run: npm run build
